name: JSON Logic Compliance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compliance_v1:
    name: compliance_v1 — Ruby ${{ matrix.ruby }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby: ["4.0", "3.4", "3.3", "3.2", "3.1", "3.0"]

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Run compliance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          ruby -Ilib script/compliance.rb -v 1 \
            2>&1 | tee tmp/compliance-v1-${{ matrix.ruby }}.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compliance-v1-${{ matrix.ruby }}
          path: |
            tmp/compliance-v1-${{ matrix.ruby }}.log
          if-no-files-found: ignore

  compliance_v2:
    name: compliance_v2 — Ruby ${{ matrix.ruby }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby: ["4.0", "3.4", "3.3", "3.2", "3.1", "3.0"]

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Run compliance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          ruby -Ilib script/compliance.rb -v 2 \
            2>&1 | tee tmp/compliance-v2-${{ matrix.ruby }}.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compliance-v2-${{ matrix.ruby }}
          path: |
            tmp/compliance-v2-${{ matrix.ruby }}.log
          if-no-files-found: ignore
